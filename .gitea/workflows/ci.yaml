# Xcode 27 host verification; the project and GitHub legacy 10.13 target remain unchanged.
# Self-hosted Linux and macOS verification; existing release gates are retained.
name: CI
'on':
  push: null
  pull_request: null
  workflow_dispatch: {}
jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Run ShellCheck
      uses: ludeeus/action-shellcheck@master
      with:
        check_together: 'yes'
        scandir: tools
    timeout-minutes: 60
  swift-format:
    runs-on: macos-home
    steps:
    - uses: actions/checkout@v7
    - run: swift format lint --strict --recursive OSXCore OSX GureumTests Preferences OSXTestApp
    timeout-minutes: 60
  build-and-test:
    runs-on: macos-home
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
        submodules: recursive
    - name: Build and test with the host Xcode
      run: xcodebuild -project Gureum.xcodeproj -scheme OSX -sdk macosx -destination platform=macOS -derivedDataPath
        "${RUNNER_TEMP}/DerivedData" MACOSX_DEPLOYMENT_TARGET=12.0 build test
    timeout-minutes: 60
permissions:
  contents: read
