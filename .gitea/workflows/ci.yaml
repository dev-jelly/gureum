# Gitea pull-mirror CI. Source checks are retained from .github/workflows.
# macOS/Windows/signing jobs remain on their existing platform-specific runners.
name: CI
'on':
  push: null
  pull_request: null
  workflow_dispatch: {}
jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Run ShellCheck
      uses: ludeeus/action-shellcheck@master
      with:
        check_together: 'yes'
        scandir: tools
    timeout-minutes: 60
permissions:
  contents: read
